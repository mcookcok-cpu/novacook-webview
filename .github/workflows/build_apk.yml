name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Install Android Platform
      run: |
        cordova platform add android@11.0.0

    - name: Install Gradle 7.6 (compatible)
      run: |
        wget -q https://services.gradle.org/distributions/gradle-7.6.4-bin.zip
        sudo unzip -q gradle-7.6.4-bin.zip -d /opt/
        sudo ln -sf /opt/gradle-7.6.4/bin/gradle /usr/local/bin/gradle

    - name: Accept Android SDK Licenses & Install Build Tools
      run: |
        yes | sdkmanager --licenses
        sdkmanager "build-tools;32.0.0" "platform-tools" "platforms;android-32"

    - name: Build Debug APK
      run: |
        export PATH=/opt/gradle-7.6.4/bin:$PATH
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: novacook-debug-apk
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk